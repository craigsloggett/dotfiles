extends: existence
message: Verb and negative in '%s'. Write the plain negative or the positive.
level: error
ignorecase: true
vocab: false
raw:
  - \b(?!(?:a|across|always|an|and|as|at|because|but|by|for|from|if|in|into|its|of|on|or|plus|since|so|than|that|the|then|this|thus|to|unless|until|when|where|while|with|yes)\b)
  - '[a-z]+\s+'
tokens:
  - no(?! longer| later| one\b| matter\b)
  - none of
  - nothing

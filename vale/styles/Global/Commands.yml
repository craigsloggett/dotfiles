extends: existence
message: Format the command '%s' as code.
level: error
vocab: false
action:
  name: edit
  params:
    - wrap
    - '`'
append: true
raw:
  - (?![/`@-])
  - (?!\.\w)
  - (?<=(?<![\w/.`@-])[a-z0-9]+(?:-[a-z0-9]+)*)
tokens:
  - actionlint
  - awk
  - bazelisk
  - devtunnel
  - gawk
  - gh
  - gocognit
  - gofmt
  - gofumpt
  - golangci-lint
  - gopls
  - goreleaser
  - gotestsum
  - govulncheck
  - gowrap
  - gpg
  - grep
  - jq
  - kubebuilder
  - kubectl
  - kustomize
  - mawk
  - nfpm
  - npm
  - nvim
  - protoc
  - python3
  - rg
  - rumdl
  - sed
  - semgrep
  - shellcheck
  - shfmt
  - ssh
  - staticcheck
  - swiftformat
  - swiftlint
  - tflint
  - xargs
  - yamlfmt
  - yamllint
  - yq
  - zsh

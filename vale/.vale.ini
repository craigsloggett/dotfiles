Vocab = Global
IgnoredScopes = code, tt, kbd, samp, \
  text.frontmatter.allowed-tools, \
  text.frontmatter.arguments, \
  text.frontmatter.effort, \
  text.frontmatter.name, \
  text.frontmatter.tools
Packages = \
  https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip
Grammars = go

[formats]
go = md

[*.{md,go}]
BasedOnStyles = Vale, Global, write-good
write-good.Adverbs = NO
write-good.E-Prime = NO
# Extended Rules
write-good.TooWordy = NO
write-good.Weasel = NO

[*.go]
Vale.Spelling = NO

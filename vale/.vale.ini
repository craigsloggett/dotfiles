Vocab = Global
IgnoredScopes = code, tt, kbd, samp, \
  text.frontmatter.allowed-tools, \
  text.frontmatter.arguments, \
  text.frontmatter.effort, \
  text.frontmatter.name, \
  text.frontmatter.tools
Packages = \
  https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip
Grammars = go

[formats]
go = md

[*.{md,go,sh}]
BasedOnStyles = Vale, Global, write-good
Vale.Avoid = error
Vale.Repetition = error
Vale.Spelling = error
Vale.Terms = error
write-good.Adverbs = NO
write-good.E-Prime = NO
write-good.Passive = suggestion
write-good.So = warning
write-good.ThereIs = warning
# Extended Rules
write-good.TooWordy = NO
write-good.Weasel = NO

[*.go]
Vale.Spelling = NO

[**/Templates/**/*.md]
BasedOnStyles =

[**/.trash/**/*.md]
BasedOnStyles =

[*.sh]
View = ShellComments
